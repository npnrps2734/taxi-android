<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UMKA Такси</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e8eaed;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { width: 120px; height: 120px; border-radius: 28px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #98a0ac; font-size: 15px; line-height: 1.5; margin: 0 0 24px; max-width: 320px; }
  button { background: #ffcc33; color: #111; border: 0; border-radius: 14px; padding: 15px 36px;
    font-size: 17px; font-weight: 700; }
  button:active { background: #ffb800; }
  a.bot { display: inline-block; margin-top: 14px; background: transparent; color: #ffcc33; border: 2px solid #ffcc33;
    border-radius: 14px; padding: 13px 26px; font-size: 16px; font-weight: 700; text-decoration: none; }
  a.bot:active { background: rgba(255, 204, 51, .15); }
  .alt { margin: 26px 0 0; font-size: 14px; color: #98a0ac; max-width: 320px; line-height: 1.45; }
  .hint { margin-top: 18px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="UMKA" />
  <h1>Сервис временно недоступен</h1>
  <p>Не удаётся подключиться к серверу. Проверьте интернет и попробуйте ещё раз. Мы уже работаем над восстановлением.</p>
  <button id="retry" type="button">Повторить</button>
  <div class="alt">Пока сервис не отвечает, можно перейти в чат-бот UMKA в мессенджере MAX:</div>
  <a class="bot" id="maxBot" href="https://max.ru/se14584240_bot">Перейти в чат-бот MAX</a>
  <div class="hint" id="hint">Попробуем снова автоматически</div>
</div>
<script>
  var BASE = 'https://umkatax.ru';
  var target = BASE + '/';
  try {
    var u = new URLSearchParams(location.search).get('u');
    // Возвращаем пользователя только на наш сайт, на любой другой адрес — нет.
    if (u && (u === BASE || u.indexOf(BASE + '/') === 0)) target = u;
  } catch (e) {}

  function go() { location.replace(target); }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);

  // Каждые 10 секунд тихо проверяем сервер: как только он ответит, возвращаем
  // пользователя на страницу. Картинка с чужого адреса подгружается без CORS.
  function ping() {
    var img = new Image();
    img.onload = go;
    img.src = BASE + '/images/logo.png?t=' + Date.now();
  }
  setInterval(ping, 10000);
</script>
</body>
</html>
