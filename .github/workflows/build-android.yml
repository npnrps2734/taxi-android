name: Build Android APK (UMKA Такси + UMKA Водитель)

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Версия Gradle закреплена (как в gradle/wrapper): самая новая (9.x) не работает
      # с Android Gradle Plugin 8.5 и роняет сборку на поиске зависимостей.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Собираются ДВА приложения из одного кода (см. productFlavors в app/build.gradle.kts):
      # passenger — «UMKA Такси» (ru.taxiapp.app), driver — «UMKA Водитель» (ru.taxiapp.driver).
      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK (UMKA Такси)
        uses: actions/upload-artifact@v4
        with:
          name: umka-taxi-debug
          path: app/build/outputs/apk/passenger/debug/*.apk

      - name: Upload debug APK (UMKA Водитель)
        uses: actions/upload-artifact@v4
        with:
          name: umka-driver-debug
          path: app/build/outputs/apk/driver/debug/*.apk

      # Подписанная релизная сборка — нужна для публикации в RuStore (там не
      # принимают debug-APK). Собирается, только если в секретах репозитория
      # заведён ключ подписи (RELEASE_KEYSTORE_BASE64) — см. RELEASE_SIGNING.md.
      # Если секреты не заданы, этот и следующий шаг просто пропускаются, и
      # workflow всё равно успешно завершается с одним debug-APK, как раньше.
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: gradle assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload release APK (UMKA Такси — для RuStore)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: umka-taxi-release
          path: app/build/outputs/apk/passenger/release/*.apk

      - name: Upload release APK (UMKA Водитель — для RuStore)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: umka-driver-release
          path: app/build/outputs/apk/driver/release/*.apk
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
